<!doctype html><meta charset="utf-8"><title>frame</title>
<!-- Transparent overlay frames for tools/render.mjs: window.frame(opts, t, W, H) -> PNG data URL. -->
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="../annotationfx.js"></script>
<script>
// every style's font, loaded before the first frame (canvas text never waits for a web font)
window.ready = AnnotationFX.loadFonts();
window.frame = function (opts, t, W, H) {
  const c = document.getElementById('c'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.clearRect(0, 0, W, H);
  const m = opts.media || {};
  AnnotationFX.draw(x, t, W, H, opts, { mediaW: m.w, mediaH: m.h });
  return c.toDataURL('image/png');
};
window.len = (opts) => AnnotationFX.length(opts);
</script>
